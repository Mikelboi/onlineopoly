<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Avatar</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #c2eccd;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(600px, calc(100% - 40px));
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            background: white;
            border: 4px solid black;
            border-radius: 20px;
        }

        #avatar-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 12px;
            margin: 24px 0;
        }

        .avatar-upload {
            margin: 20px 0;
        }

        #uploaded-avatar-preview {
            display: block;
            width: 100px;
            height: 100px;
            margin: 12px auto;
            object-fit: contain;
        }

        #uploaded-avatar-preview[hidden] {
            display: none;
        }

        .avatar-choice {
            display: grid;
            justify-items: center;
            gap: 6px;
            padding: 10px;
            border: 2px solid #aaa;
            border-radius: 10px;
            cursor: pointer;
        }

        .avatar-choice:has(input:checked) {
            border-color: #238636;
            background: #eff9f0;
        }

        .avatar-choice img {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        #save-avatar {
            margin: 16px 8px 0;
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #238636;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #save-avatar:hover {
            background: #1b6f2b;
        }

        #save-avatar:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #back-to-menu {
            margin-top: 16px;
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #238636;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #back-to-menu:hover {
            background: #1b6f2b;
        }
    </style>
</head>

<body>
    <main>
        <h1>Choose Your Avatar</h1>
        <p>Select an avatar to represent you.</p>

        <section class="avatar-upload">
            <h2>Upload your own picture</h2>
            <input
                id="avatar-upload"
                type="file"
                accept="image/png,image/jpeg,image/webp"
            >
            <img
                id="uploaded-avatar-preview"
                alt="Uploaded avatar preview"
                hidden
            >
        </section>

        <h2>Or choose a game piece</h2>

        <div id="avatar-options">
            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="top_hat">
                <img src="/Game/sprites/Hat.png" alt="">
                <span>Top Hat</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="race_car">
                <img src="/Game/sprites/Car.png" alt="">
                <span>Race Car</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="dog">
                <img src="/Game/sprites/Dog.png" alt="">
                <span>Dog</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="battleship">
                <img src="/Game/sprites/Battleship.png" alt="">
                <span>Battleship</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="thimble">
                <img src="/Game/sprites/Thimble.png" alt="">
                <span>Thimble</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="boot">
                <img src="/Game/sprites/Boot.png" alt="">
                <span>Boot</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="cat">
                <img src="/Game/sprites/cat.png" alt="">
                <span>Cat</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="wheelbarrow">
                <img src="/Game/sprites/Wheelbarrow.png" alt="">
                <span>Wheelbarrow</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="duck">
                <img src="/Game/sprites/duck.png" alt="">
                <span>Duck</span>
            </label>

            <label class="avatar-choice">
                <input type="radio" name="avatar-choice" value="windmill">
                <img src="/Game/sprites/windmill.png" alt="">
                <span>Windmill</span>
            </label>
        </div>

        <button type="button" id="save-avatar">Save Avatar</button>

        <button type="button" id="back-to-menu">Back to Main Menu</button>
        <p id="avatar-message" role="status"></p>
    </main>

    <script>
        const avatarUpload = document.getElementById('avatar-upload');
        const avatarPreview = document.getElementById('uploaded-avatar-preview');
        const avatarMessage = document.getElementById('avatar-message');
        const gamePieceChoices = document.querySelectorAll(
            'input[name="avatar-choice"]'
        );

        let uploadedImageUrl = null;

        avatarUpload.addEventListener('change', () => {
            const file = avatarUpload.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith('image/')) {
                avatarMessage.textContent = 'Please choose an image file.';
                avatarUpload.value = '';
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                avatarMessage.textContent =
                    'Please choose an image smaller than 5 MB.';
                avatarUpload.value = '';
                return;
            }

            if (uploadedImageUrl) {
                URL.revokeObjectURL(uploadedImageUrl);
            }

            uploadedImageUrl = URL.createObjectURL(file);
            avatarPreview.src = uploadedImageUrl;
            avatarPreview.alt = `Preview of ${file.name}`;
            avatarPreview.hidden = false;

            gamePieceChoices.forEach(choice => {
                choice.checked = false;
            });

            avatarMessage.textContent = 'Uploaded image selected.';
        });

        gamePieceChoices.forEach(choice => {
            choice.addEventListener('change', () => {
                const choiceLabel = choice.closest('.avatar-choice');
                const choiceImage = choiceLabel.querySelector('img');
                const choiceName = choiceLabel.querySelector('span').textContent;

                avatarUpload.value = '';

                if (uploadedImageUrl) {
                    URL.revokeObjectURL(uploadedImageUrl);
                    uploadedImageUrl = null;
                }

                avatarPreview.src = choiceImage.src;
                avatarPreview.alt = `${choiceName} avatar preview`;
                avatarPreview.hidden = false;
                avatarMessage.textContent = `${choiceName} selected.`;
            });
        });

        document.getElementById('back-to-menu')
            .addEventListener('click', () => {
                window.location.href = '/menu';
            });

        const saveAvatarButton = document.getElementById('save-avatar');

        const avatarImagePaths = {
            top_hat: '/Game/sprites/Hat.png',
            race_car: '/Game/sprites/Car.png',
            dog: '/Game/sprites/Dog.png',
            battleship: '/Game/sprites/Battleship.png',
            thimble: '/Game/sprites/Thimble.png',
            boot: '/Game/sprites/Boot.png',
            cat: '/Game/sprites/cat.png',
            wheelbarrow: '/Game/sprites/Wheelbarrow.png',
            duck: '/Game/sprites/duck.png',
            windmill: '/Game/sprites/windmill.png'
        };

        saveAvatarButton.addEventListener('click', async () => {
            const selectedChoice = document.querySelector(
                'input[name="avatar-choice"]:checked'
            );
            const uploadedFile = avatarUpload.files[0];

            if (!uploadedFile && !selectedChoice) {
                avatarMessage.textContent = 'Choose or upload an avatar first.';
                return;
            }

            saveAvatarButton.disabled = true;

            try {
                let endpoint = '/avatar';
                let payload;

                if (uploadedFile) {
                    const imageData = await new Promise((resolve, reject) => {
                        const reader = new FileReader();

                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => {
                            reject(
                                new Error('Could not read the uploaded image.')
                            );
                        };

                        reader.readAsDataURL(uploadedFile);
                    });

                    endpoint = '/avatar-upload';
                    payload = { imageData };
                } else {
                    payload = {
                        avatarPath: avatarImagePaths[selectedChoice.value]
                    };
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || 'Could not save your avatar.'
                    );
                }

                avatarMessage.textContent = 'Avatar saved.';
            } catch (error) {
                avatarMessage.textContent =
                    error.message || 'Could not connect to the server.';
            } finally {
                saveAvatarButton.disabled = false;
            }
        });
    </script>
    <script src="/Game/music.js"></script>
</body>
</html>
