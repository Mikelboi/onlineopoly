<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlineopoly - Game Board</title>

    <style>
        /* ========================================
           1. PAGE LAYOUT
        ======================================== */

        body {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;

            font-family: 'Franklin Gothic Medium',
                'Arial Narrow', Arial, sans-serif;
            color: #222;
            background-color: #c2eccd;
        }

        h1 {
            flex-shrink: 0;
            margin: 5px 0;
            text-align: center;
            color: #238636;
        }

        #game-board-section {
            width: 100%;
        }

        #game-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }

        #diceResult {
            max-width: 100%;
            overflow-wrap: anywhere;
            margin: 0;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #fff;
            color: #333;
            font-weight: bold;
        }

        #game-controls p {
            margin: 0;
        }

        /* PLAYER DASHBOARD LAYOUT */

        #game-controls {
            flex-shrink: 0;
            margin: 4px auto 8px;
        }

        #game-board-section {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-layout {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
            grid-template-rows: 1fr 1fr 1fr;
            align-items: center;
            justify-items: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        #game-board {
            grid-column: 2;
            grid-row: 1 / 4;
            transform: translateY(285px);
        }

        .player-card {
            width: min(100%, 190px);
            padding: 10px;
            box-sizing: border-box;
            background: #fffdf3;
            border: 2px solid #356b43;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            overflow-wrap: anywhere;
            transform: translateY(250px);
        }

        .player-card h3 {
            margin: 0 0 8px;
            color: #238636;
            font-size: 15px;
        }

        .player-card p {
            margin: 4px 0;
            font-size: 12px;
        }

        #player-card-1 {
            grid-column: 1;
            grid-row: 1;
            justify-self: start;
            align-self: start;
            transform: translateY(0px);
        }

        #player-card-2 {
            grid-column: 3;
            grid-row: 1;
            justify-self: end;
            align-self: start;
            transform: translateY(0px);
        }

        #player-card-3 {
            grid-column: 1;
            grid-row: 3;
            justify-self: start;
            align-self: end;
            transform: translateY(0px);
        }

        #player-card-4 {
            grid-column: 3;
            grid-row: 3;
            justify-self: end;
            align-self: end;
            transform: translateY(0px);
        }

        @media (max-width: 700px) {
            .game-layout {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: auto 1fr auto;
                gap: 5px;
            }

            #game-board {
                grid-column: 1 / 3;
                grid-row: 2;
                width: min(92vw, 55vh);
            }

            .player-card {
                width: 100%;
                max-width: 180px;
                padding: 6px;
            }

            .player-card h3 {
                font-size: 12px;
            }

            .player-card p {
                font-size: 10px;
            }

            #player-card-1 {
                grid-column: 1;
                grid-row: 1;
            }

            #player-card-2 {
                grid-column: 2;
                grid-row: 1;
            }

            #player-card-3 {
                grid-column: 1;
                grid-row: 3;
            }

            #player-card-4 {
                grid-column: 2;
                grid-row: 3;
            }
        }

        /* ========================================
           2. BOARD GRID
        ======================================== */

        .game-board {
            display: grid;
            grid-template-columns: 1.5fr repeat(9, minmax(0, 1fr)) 1.5fr;
            grid-template-rows: 1.5fr repeat(9, minmax(0, 1fr)) 1.5fr;

            width: min(90vw, 98vh, 1050px);
            aspect-ratio: 1 / 1;
            margin: 15px auto 0;

            gap: 2px; /* This creates the divider lines between tiles */
            border: 2px solid black;
            background-color: black; /* Changed to black so the gaps act as dark borders */
            box-sizing: border-box;
        }

        #roll-dice {
            display: none;
        }

        /* ========================================
           3. BOARD SPACES
        ======================================== */

        .board-space {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
            padding: 4px;
            background-color: #FFEBCD; /* Gives tiles their distinct background to reveal dividers */
        }

        .bottom-space {
            padding-top: calc(24% + 4px);
            padding-bottom: 4px;
            flex-direction: column;
        }

        .bottom-space.image-only-space {
            border: none;
            padding: 0;
            box-sizing: border-box;
        }

        .bottom-space.image-only-space .space-content {
            inset: 0;
            padding: 0;
            border: none;
        }



        .top-space {
            padding-bottom: calc(24% + 4px);
            padding-top: 4px;
            flex-direction: column-reverse;
        }

        .left-space {
            padding-right: calc(24% + 4px);
            padding-left: 4px;
            flex-direction: row;
            align-items: center;
        }

        .right-space {
            padding-left: calc(24% + 4px);
            padding-right: 4px;
            flex-direction: row-reverse;
            align-items: center;
        }

        .board-space.corner,
        .board-space.corner-tile {
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fafdfa;
        }

        .board-space.image-only-space,
        .board-space.corner {
        border: none;
    }

        /* Ensure images dynamically scale without ever clipping */
        .board-space img {
            max-width: 250%;
            max-height: 250%;
            width: 119%;
            height: 113%;
            object-fit: fill;
            flex-shrink: 0;
            z-index: 2;
        }

        .bottom-space.image-only-space img {
            max-width: 250%;
            max-height: 250%;
            width: 118%;
            height: 110%;
            object-fit: fill;
            object-position: center;
            flex-shrink: 1;
        }

        .board-space.corner img,
        .board-space.corner-tile img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%; /* Caps image canvas size to save rows for titles */
            object-fit: cover;
            z-index: 1;
        }

        .board-space.corner[data-position="10"] .corner-sprite {
            transform: rotate(90deg);
        }

        .left-space,
        .right-space {
            position: relative;
            overflow: hidden;
        }

        .board-space.left-space img,
        .board-space.right-space img {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: fill;
            object-position: center;
        }

        .left-space img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80% !important;
            height: auto !important;
            max-width: none !important;
            max-height: none !important;
            object-fit: contain !important;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .right-space img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80% !important;
            height: auto !important;
            max-width: none !important;
            max-height: none !important;
            object-fit: contain !important;
            transform: translate(-50%, -50%) rotate(-90deg);
        }

        .left-space.community-chest img,
        .left-space[class*="chest"] img,
        .left-space img[src*="chest"],
        .left-space img[alt*="Chest"],
        .left-space img[alt*="chest"] {
            width: 180% !important;
            height: 165% !important;
        }

        .right-space.community-chest img,
        .right-space[class*="chest"] img,
        .right-space img[src*="chest"],
        .right-space img[alt*="Chest"],
        .right-space img[alt*="chest"] {
            width: 180% !important;
            height: 165% !important;
        }

        .bottom-space.community-chest img,
        .bottom-space[class*="chest"] img,
        .bottom-space img[src*="chest"],
        .bottom-space img[alt*="Chest"],
        .bottom-space img[alt*="chest"] {
            width: 100% !important;
            height: 102% !important;
        }


        /* Make left and right image-only spaces use the full tile */
        .board-space.left-space.image-only-space,
        .board-space.right-space.image-only-space {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            padding: 0 !important;
            overflow: hidden;
        }

        /* Remove the size and rotation restrictions on the image container */
        .board-space.left-space.image-only-space .space-content,
        .board-space.right-space.image-only-space .space-content {
            position: absolute;
            inset: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            transform: none !important;
            width: 100%;
            height: 100%;
        }
        /* Text styles to prevent overflowing */
        .board-space p,
        .board-space span,
        .board-space .title {
            margin: 2px 0;
            font-size: clamp(8px, 1.2vw, 12px);
            text-align: center;
            line-height: 1.2;
            z-index: 2;
            white-space: normal;
        }

        /* ========================================
           4. PROPERTY COLOR BANDS
        ======================================== */

        .property-color {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 24%;
            min-height: 4px;

            box-sizing: border-box;
            border-bottom: 2px solid black; /* Crisp black separator line for the color bar */
        }

        .bottom-space .property-color {
            top: 0;
        }

        .left-space .property-color {
            top: 0;
            right: 0;
            left: auto;

            width: 24%;
            height: 100%;

            border-bottom: none;
            border-left: 2px solid black;
        }

        .top-space .property-color {
            top: 0;
            bottom: auto;

            border-top: none;
            border-bottom: 2px solid black;
        }

        .right-space .property-color {
            top: 0;
            right: auto;
            left: 0;

            width: 24%;
            height: 100%;

            border-right: 2px solid black;
            border-bottom: none;
        }

        .board-space.corner .property-color,
        .board-space.corner-tile .property-color {
            display: none;
        }

        /* ========================================
           5. SPACE CONTENT & INNER ROTATION
        ======================================== */

        .space-content {
            position: absolute;
            inset: 24% 0 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 1px;
            padding: 1px;
            box-sizing: border-box;
            overflow: hidden;
            text-align: center;
        }

        .left-space .space-content {
            inset: 0 0 0 24%;
            transform: rotate(90deg);
            transform-origin: center center;
        }

        .top-space .space-content {
            inset: 0;
            transform: none;
        }

        .right-space .space-content {
            inset: 0 24% 0 0;
            transform: rotate(-90deg);
            transform-origin: center center;
        }

        .board-space.corner .space-content,
        .board-space.corner-tile .space-content {
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transform: none;
            z-index: 2;
        }

        /* ========================================
           6. SPACE NAMES AND PRICES
        ======================================== */

        .space-name {
            display: block;
            width: 100%;
            margin: auto 0;

            color: #26352b;
            font-size: clamp(7px, 0.9vw, 12px);
            font-weight: 800;
            line-height: 1.2;

            overflow-wrap: anywhere;
        }

        .right-space .space-name,
        .right-space .space-price,
        .right-space .space-instruction {
             position: relative;
             top: 5px;
        }

        .left-space .space-name {
            position: relative;
            top: 10px;
            font-size: clamp(10px, 1vw, 13px);
            font-weight: 900;
            color: #17251b;
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.25);
        }

        .left-space .space-price,
        .left-space .space-instruction {
            position: relative;
            top: 10px;
            color: #222;
            font-weight: 800;
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
        }


        .top-space .space-name,
        .top-space .space-price,
        .top-space .space-instruction {
            position: relative;
            top: 8px;
        }

        .bottom-space .space-name,
        .bottom-space .space-price,
        .bottom-space .space-instruction {
            position: relative;
            top: -4px;
        }


        .left-space .space-name {
            font-size: clamp(9px, 0.85vw, 11px);
        }

        .chance-space img {
            width: 100%;
            height: 100%;
        }

        .bottom-space.chance-space img {
            width: 100% !important;
            height: 150% !important;
        }

        .right-space.chance-space img {
            width: 150% !important;
            height: 150% !important;
        }

        .top-space.chance-space img {
            width: 108% !important;
            height: 108% !important;
        }

        .space-price {
            padding-top: 0px;

            color: #555d52;
            font-size: clamp(22px, 0.95vw, 17px);
            font-weight: 700;
        }

        .space-instruction {
            color: #222;
            font-size: clamp(7px, 0.8vw, 11px);
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
        }

        .board-space.corner .space-name,
        .board-space.corner-tile .space-name {
            flex: 0 0 auto;
            font-size: clamp(10px, 1.1vw, 10px);
            line-height: 1;
        }

        .board-space .space-price {
            flex: 0 0 auto;
            padding-top: 0;
            font-size: clamp(10px, 1vw, 8px);
        }

        .luxury-tax-icon {
            display: block;
            font-size: 22px !important;
            line-height: 1.2;
            margin: 4px 0;
            transform: scale(1.4);
            transform-origin: center;
        }

        .income-tax-diamond {
            display: block;
            color: #222;
            font-size: clamp(10px, 1.2vw, 16px);
            line-height: 1;
            margin-bottom: 3px;
        }

        /* ========================================
           7. BOARD CENTER POSITIONING
        ======================================== */

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background-color: #d8f0dc; /* Original green background for the game center canvas */
            position: relative;
        }

        .center-logo {
            font-size: clamp(38px, 5vw, 64px);
            font-weight: 900;
            color: #fca37c;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: translateY(-8px) rotate(-35deg);
        }

        #property-purchase-menu {
            position: absolute;
            z-index: 20;
            width: min(320px, 85%);
            padding: 20px;
            box-sizing: border-box;
            background: #fffdf3;
            border: 3px solid #236b86;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        #property-purchase-menu[hidden] {
            display: none;
        }

        #property-purchase-menu h2 {
            margin: 0 0 8px;
            color: #fca37c;
            font-size: 22px;
        }

        #property-purchase-menu p {
            margin: 8px 0 14px;
        }

        #property-purchase-menu button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #buy-property-button {
            background: #328623;
        }

        #auction-property-button {
            background: #b73d1f;
        }

        #auction-bid-amount::-webkit-inner-spin-button,
        #auction-bid-amount::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #auction-bid-amount {
            -moz-appearance: textfield;
            appearance: textfield;
        }


        /* Rent popup */
        #rent-popup[hidden] {
            display: none;
        }

        #rent-popup {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
        }

        .rent-popup-content {
            width: min(90%, 360px);
            padding: 28px;
            text-align: center;
            background: white;
            border: 5px solid #222;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .rent-popup-content h2 {
            color: #f48859;
            margin-top: 0;
        }

        #rent-popup-amount {
            font-size: 28px;
            font-weight: bold;
            color: #f48859;
        }

        #rent-popup-continue {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #f48859;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .owned-properties-tab {
            margin-top: 8px;
            border-top: 1px solid #c8d5c5;
        }

        .owned-properties-tab summary {
            padding: 8px 6px;
            color: #236b43;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
        }

        .owned-properties-tab summary::-webkit-details-marker {
            display: none;
        }

        .owned-properties-tab summary::after {
            content: "+";
            float: right;
        }

        .owned-properties-tab[open] summary::after {
            content: "−";
        }

        .owned-properties-list {
            display: grid;
            gap: 3px;
            max-height: 110px;
            margin: 0;
            padding: 0 0 6px;
            overflow-y: auto;
            list-style: none;
        }

        .owned-property-group {
            display: grid;
            gap: 3px;
        }

        .owned-property-group-heading {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 2px;
            color: #435443;
            font-size: 10px;
        }

        .owned-property-group-swatch {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        .owned-property-group-items {
            display: grid;
            gap: 3px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .owned-property-item {
            display: grid;
            grid-template-columns: 10px 1fr auto;
            align-items: center;
            width: 100%;
            gap: 5px;
            padding: 4px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: #fff;
            color: inherit;
            font-size: 10px;
            text-align: left;
            cursor: pointer;
        }

        .owned-property-item:hover,
        .owned-property-item:focus-visible {
            border-color: #356b43;
            outline: none;
        }

        .owned-property-sprite {
            width: 8px;
            height: 22px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        .owned-property-name {
            overflow-wrap: anywhere;
        }

        .owned-property-price {
            color: #526452;
            white-space: nowrap;
        }

        .owned-properties-empty {
            margin: 0 6px 8px;
            color: #667466;
            font-size: 11px;
        }

        .property-card-dialog {
            position: relative;
            width: min(90vw, 380px);
            padding: 0;
            border: 2px solid #26352b;
            border-radius: 12px;
            background: #fffdf3;
            color: #26352b;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        }

        .property-card-dialog::backdrop {
            background: rgba(20, 30, 22, 0.58);
        }

        .property-card-band {
            min-height: 76px;
            padding: 10px 42px 10px 16px;
            box-sizing: border-box;
            border-bottom: 2px solid #26352b;
            color: #fff;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        }

        .property-card-kicker {
            margin: 0 0 5px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .property-card-band h2 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
        }

        .property-card-content {
            padding: 12px 20px 20px;
        }

        .property-card-content h2 {
            margin: 0 34px 4px 0;
            font-size: 22px;
        }

        .property-card-section-label {
            margin-top: 18px;
            padding-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .property-card-building-costs {
            margin-top: 6px;
        }

        .property-card-building-costs .property-card-section-label {
            margin: 0;
            padding-bottom: 2px;
        }

        .property-card-building-details {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 16px;
            margin: 4px 0 0;
            padding-top: 0;
            font-size: 14px;
        }

        .property-card-building-details dt,
        .property-card-building-details dd {
            margin: 0;
        }

        .property-card-building-details dd {
            font-weight: bold;
            text-align: right;
        }

        .property-card-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: 1px solid #26352b;
            border-radius: 50%;
            background: #fffdf3;
            color: #26352b;
            font-size: 20px;
            cursor: pointer;
        }

        .property-card-details {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 16px;
            margin: 2px 0 0;
            padding-top: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #c8d5c5;
            font-size: 14px;
        }

        .property-card-details dt,

<script>
    const socket = io();

        socket.on('playerMoved', async (move) => {
        if (Number(move.gameId) !== Number(gameId)) {
            return;
        }

        const rolledDoubles = move.dice.die1 === move.dice.die2;
        diceResult.textContent =
            `${move.playerName} rolled a ${move.dice.die1} and a ` +
            `${move.dice.die2}: ${rolledDoubles ? 'Doubles' : 'Not Doubles'}.`;

        await loadPlayerTokens();
    });

    socket.on('turnChanged', async (data) => {
        if (Number(data.gameId) !== Number(gameId)) return;
        await loadPlayerTokens();
    });

    socket.on('tokenUpdated', async (data) => {
         console.log('Received tokenUpdated:', data);

        const currentGameId =
            new URLSearchParams(window.location.search).get('gameId');

        if (String(data.gameId) !== String(currentGameId)) {
            return;
        }

        await loadPlayerTokens();
    });

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('gameId') || document.body.dataset.gameId;

    socket.on('connect', () => {
        console.log('Socket connected:', socket.id);

        if (gameId) {
            socket.emit('joinGame', gameId);
        }
    });

    socket.on('connect_error', (error) => {
        console.error('Socket connection error:', error.message);
    });

    socket.on('propertyPurchased', async (data) => {
            if (Number(data.gameId) !== Number(gameId)) {
                return;
            }

            console.log('Property purchased:', data);

            diceResult.textContent =
                `${data.playerName} purchased ${data.propertyName}.`;

            await loadPlayerTokens();
        });


let auctionTimer = null;
let auctionFinishRequested = false;
let activeAuctionId = null;

async function finishAuction() {
    if (auctionFinishRequested || activeAuctionId === null) {
        return;
    }

    auctionFinishRequested = true;

    try {
        const response = await fetch('/games/auction/finish', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                gameId: Number(gameId),
                auctionId: Number(activeAuctionId)
            })
        });

        const result = await response.json();

        console.log('Auction finish response:', {
            status: response.status,
            result
        });

        if (!response.ok) {
            auctionBidMessage.textContent =
                result.message || 'Could not finish the auction.';

            // Allow another attempt if the server rejected the request.
            auctionFinishRequested = false;
        }
    } catch (error) {
        console.error('Finish auction request failed:', error);

        auctionBidMessage.textContent =
            'Could not finish the auction. Check the connection and try again.';

        auctionFinishRequested = false;
    }
}

function startAuctionCountdown(endsAt, propertyName) {
    if (auctionTimer !== null) {
        clearInterval(auctionTimer);
        auctionTimer = null;
    }

    auctionFinishRequested = false;

    const endTime = new Date(endsAt).getTime();

    if (!Number.isFinite(endTime)) {
        console.error('Invalid auction end time:', endsAt);
        auctionBidMessage.textContent =
            'Could not load the auction countdown.';
        return;
    }

    function updateCountdown() {
        const secondsLeft = Math.max(
            0,
            Math.ceil((endTime - Date.now()) / 1000)
        );

        if (secondsLeft > 0) {
            auctionCountdown.textContent =
                `Auction for ${propertyName}: ${secondsLeft} seconds remaining.`;
            return;
        }

        auctionCountdown.textContent = 'Auction expired. Finishing...';

        if (auctionTimer !== null) {
            clearInterval(auctionTimer);
            auctionTimer = null;
        }

        finishAuction();
    }

    updateCountdown();

    if (auctionTimer === null && !auctionFinishRequested) {
        auctionTimer = setInterval(updateCountdown, 250);
    }
}


        socket.on('auctionStarted', (data) => {
            if (Number(data.gameId) !== Number(gameId)) return;

            activeAuctionId = data.auctionId;

            propertyPurchaseMenu.hidden = true;
            auctionBiddingSection.hidden = false;

            auctionBidMessage.textContent = 'Auction started! Place your bid.';
            auctionHighestBidder.textContent = 'Highest bidder: No bids yet.';
            auctionBidAmount.value = '';

            startAuctionCountdown(data.endsAt, data.propertyName);
        });


        socket.on('auctionBidUpdated', (data) => {
            if (Number(data.gameId) !== Number(gameId)) {
                return;
            }

            console.log('Auction bid updated:', data);

            auctionHighestBidder.textContent =
                `Highest bidder: ${data.highestBidderName} ($${data.highestBid}).`;
        });


socket.on('auctionFinished', async (data) => {
    if (Number(data.gameId) !== Number(gameId)) {
        return;
    }

    if (auctionTimer !== null) {
        clearInterval(auctionTimer);
        auctionTimer = null;
    }

    auctionBiddingSection.hidden = true;
    auctionBidAmount.value = '';
    activeAuctionId = null;
    auctionFinishRequested = false;

    if (data.status === 'no_bids') {
        diceResult.textContent = 'The auction ended with no bids.';
    } else {
        diceResult.textContent =
            `Auction finished! ${data.winnerPlayerName || 'The winner'} ` +
            `won ${data.propertyName || 'the property'} for $${data.winningBid}.`;
    }

    await loadPlayerTokens();
});


        socket.on('rentPaid', async (data) => {
            if (Number(data.gameId) !== Number(gameId)) {
                return;
            }

            diceResult.textContent =
                `${data.playerName} landed on ${data.propertyName} ` +
                `and paid $${data.rent} rent to ${data.ownerPlayerName}.`;

            await loadPlayerTokens();
        });

        const diceResult = document.getElementById('diceResult');
        let isRolling = false;
        const propertyCardDialog = document.getElementById('property-card-dialog');
        const propertyCardClose = document.getElementById('property-card-close');

        propertyCardClose.addEventListener('click', () => {
            propertyCardDialog.close();
        });

        const chanceCardDialog = document.getElementById('chance-card-dialog');
        const chanceCardTitle = document.getElementById('chance-card-title');
        const chanceCardMessage = document.getElementById('chance-card-message');
        const chanceCardContinue = document.getElementById('chance-card-continue');

        chanceCardContinue.addEventListener('click', () => {
            chanceCardDialog.close();
        });

        function showChanceCardPopup(card) {
            if (!card) {
                return Promise.resolve();
            }

            const cardName = card.id
                .split('-')
                .map(word => word[0].toUpperCase() + word.slice(1))
                .join(' ');

            chanceCardTitle.textContent = cardName;

            if (card.type === 'collect') {
                chanceCardMessage.textContent = `Collect $${card.amount}.`;
            } else if (card.type === 'pay') {
                chanceCardMessage.textContent = `Pay $${card.amount}.`;
            } else if (card.type === 'pay_repairs') {
                chanceCardMessage.textContent =
                    `Pay $${card.houseCost} for each house and ` +
                    `$${card.hotelCost} for each hotel you own.`;
            } else if (card.type === 'pay_each_player') {
                chanceCardMessage.textContent =
                    `Pay $${card.amount} to each other player.`;
            } else if (card.type === 'collect_each_player') {
                chanceCardMessage.textContent =
                    `Collect $${card.amount} from each other player.`;
            } else if (card.type === 'move_to') {
                const destinationNames = {
                    0: 'GO',
                    31: 'Gump Grove',
                    39: 'Boardwalk'
                };
                const destinationName =
                    destinationNames[card.position] ||
                    `space ${card.position}`;

                chanceCardMessage.textContent = card.collectGo
                    ? `Advance to ${destinationName} and collect $200.`
                    : `Advance to ${destinationName}.`;
            } else if (card.type === 'move_relative') {
                chanceCardMessage.textContent =
                    `Move ${Math.abs(card.spaces)} spaces ` +
                    `${card.spaces < 0 ? 'back' : 'forward'}.`;
            } else if (card.type === 'move_to_nearest') {
                const rentRule = card.target === 'railroad'
                    ? `${card.rentMultiplier} times the railroad's normal rent`
                    : `${card.rentMultiplier} times the dice roll`;

                chanceCardMessage.textContent =
                    `Advance to the nearest ${card.target}. If owned, pay ${rentRule}.`;
            } else if (card.type === 'go_to_jail') {
                chanceCardMessage.textContent = 'Move directly to Jail.';
            } else if (card.type === 'get_out_of_jail_free') {
                chanceCardMessage.textContent =
                    'Keep this card to use when you need to leave Jail.';
            } else {
                chanceCardMessage.textContent =
                    'The effect for this card will be added in a later step.';
            }

            chanceCardDialog.showModal();

            return new Promise(resolve => {
                chanceCardDialog.addEventListener('close', resolve, { once: true });
            });
        }

        const propertyPurchaseMenu = document.getElementById('property-purchase-menu');
        const purchasePropertyName = document.getElementById('purchase-property-name');
        const purchasePropertyPrice = document.getElementById('purchase-property-price');

        const buyPropertyButton = document.getElementById('buy-property-button');
        const auctionPropertyButton = document.getElementById('auction-property-button');

        const auctionBiddingSection = document.getElementById('auction-bidding-section');
        const auctionBidAmount = document.getElementById('auction-bid-amount');
        const placeBidButton = document.getElementById('place-bid-button');
        const auctionBidMessage = document.getElementById('auction-bid-message');
        const auctionCountdown = document.getElementById('auction-countdown');
        const auctionHighestBidder = document.getElementById('auction-highest-bidder');

        const useJailCardButton =
            document.getElementById('use-jail-card-button');

        useJailCardButton.addEventListener('click', async event => {
            event.stopPropagation();

            if (isRolling) return;

            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('gameId') || document.body.dataset.gameId;

            if (!gameId) {
                diceResult.textContent = 'Game ID is missing.';
                return;
            }

            useJailCardButton.disabled = true;

            try {
                const response = await fetch('/games/use-jail-card', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ gameId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Could not use the Jail card.');
                }

                diceResult.textContent = data.message;
            } catch (error) {
                diceResult.textContent = error.message;
            } finally {
                useJailCardButton.disabled = false;
                await loadPlayerTokens();
            }

        async function rollDice() {
        if (isRolling) return;

        if (
            !propertyPurchaseMenu.hidden ||
            !document.getElementById('rent-popup').hidden
        ) {
            return;
        }

        isRolling = true;
            diceResult.textContent = 'Rolling dice...';




    try {
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('gameId') || document.body.dataset.gameId;

        if (!gameId) {
            throw new Error('Game ID is missing from the URL.');
        }

        const response = await fetch('/games/roll', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ gameId })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || 'Could not roll dice.');
        }

        await showChanceCardPopup(data.chanceCard);


        const rolledDoubles = data.dice.die1 === data.dice.die2;
        const rollMessage =
            `You rolled a ${data.dice.die1} and a ${data.dice.die2}: ` +
            `${rolledDoubles ? '(Doubles)' : '(Not Doubles)'}.`;
        const outcomeMessage = data.jailBailPaid
            ? 'You paid $50 bail and left Jail.'
            : data.jailAttempt
                ? `${data.message} (attempt ${data.jailAttempt} of 3).`
                : !data.message
                    ? ''
                    : data.message;

        diceResult.textContent = outcomeMessage
            ? `${rollMessage} ${outcomeMessage}`
            : rollMessage;

        const gameData = await loadPlayerTokens();

        if (gameData) {
            if (data.rent && data.rent.rentPaid) {
                showRentPopup(data.rent);
            } else {
                const purchaseMenu = document.getElementById('property-purchase-menu');

                showPropertyPurchaseMenu(data.newPosition, gameData);

                if (purchaseMenu.hidden) {
                    await endTurn();
                }
            }
        }

    } catch (error) {
        diceResult.textContent = error.message;
    } finally {
        isRolling = false;
         await loadPlayerTokens();
    }
};

        item => Number(item.board_position) === Number(position)
    );

    // If the property isn't in the database, don't offer a purchase.
    if (!property) {
        propertyPurchaseMenu.hidden = true;
        return;

    // Check whether its owner is one of this game's players.
    const isOwned = gameData.players.some(
        player =>
            Number(player.player_id) === Number(property.player_id)
    );

    if (isOwned) {
        propertyPurchaseMenu.hidden = true;
        return;

        function buildBoard() {
            const board = document.getElementById("game-board");

            // Remove previously generated spaces.
            board.querySelectorAll(".board-space").forEach(space => {
                space.remove();
            });

            boardSpaces.forEach((space, index) => {
                const tile = document.createElement("div");
                tile.className = "board-space";
                tile.dataset.position = index;

                // Determine which side of the board contains the tile.
                if (index <= 10) {
                    tile.classList.add("bottom-space");
                } else if (index <= 19) {
                    tile.classList.add("left-space");
                } else if (index <= 30) {
                    tile.classList.add("top-space");
                } else {
                    tile.classList.add("right-space");
                }

                if (space.type === "corner") {
                    tile.classList.add("corner");
                }

                if (space.name.trim().toLowerCase() === "chance") {
                    tile.classList.add("chance-space");
                }

                const imageOnlyNames = [
                    "electric company",
                    "water works",
                    "short line",
                    "reading railroad",
                    "pennsylvania railroad",
                    "b&o railroad",
                    "chance",
                    "community chest"
                ];

                if (
                    imageOnlyNames.includes(space.name.trim().toLowerCase()) &&
                    space.image
                ) {
                    tile.classList.add("image-only-space");
                }

                // Calculate the tile's grid position.
                let row;
                let col;

                if (index <= 10) {
                    row = 11;
                    col = 11 - index;
                } else if (index <= 19) {
                    row = 11 - (index - 10);
                    col = 1;
                } else if (index <= 30) {
                    row = 1;
                    col = index - 19;
                } else {
                    row = index - 29;
                    col = 11;
                }

                tile.style.gridRow = row;
                tile.style.gridColumn = col;

                // Add the property color band only to normal spaces.
                if (space.color && !tile.classList.contains("image-only-space")) {
                    const colorBand = document.createElement("div");
                    colorBand.className = "property-color";
                    colorBand.style.backgroundColor = space.color;
                    tile.appendChild(colorBand);
                }

                // Create the content container.
                const content = document.createElement("div");
                content.className = "space-content";

                if (space.name === "Luxury Tax") {
                const ring = document.createElement("span");
                ring.className = "luxury-tax-icon";
                ring.textContent = "💍";
                content.appendChild(ring);
            }

                        if (space.name === "Income Tax") {
                const diamond = document.createElement("span");
                diamond.className = "income-tax-diamond";
                diamond.textContent = "◆";
                content.appendChild(diamond);
            }

                // Add a sprite when the space has one.
                if (space.image) {
                    const image = document.createElement("img");

                    image.className = space.type === "corner"
                        ? "corner-sprite"
                        : "space-sprite";

                    image.src = space.image;
                    image.alt = space.name;

                    content.appendChild(image);
                }

                // Add the space name only to normal tiles.
                if (!tile.classList.contains("image-only-space")) {
                    const name = document.createElement("span");
                    name.className = "space-name";
                    name.textContent = space.name;
                    content.appendChild(name);
                }

                if (space.text) {
                    const instruction = document.createElement("span");
                    instruction.className = "space-instruction";
                    instruction.textContent = space.text;
                    content.appendChild(instruction);
                }

                // Add an optional corner subtitle.
                if (space.subtitle) {
                    const subtitle = document.createElement("span");
                    subtitle.className = "corner-subtitle";
                    subtitle.textContent = space.subtitle;
                    content.appendChild(subtitle);
                }

                // Add the purchase price when one exists.
               if (!tile.classList.contains("image-only-space") && space.price !== undefined) {
                    const price = document.createElement("span");
                    price.className = "space-price";
                    price.textContent = `$${space.price}`;
                    content.appendChild(price);
                }

                // Finish and insert the tile.
                tile.appendChild(content);
                board.appendChild(tile);
            });
        }

            players.forEach(player => {

                    `.board-space[data-position="${player.position}"]`
                );

                if (!space) {
                    console.warn(
                        'Could not find board space for player:',
                        player.player_name,
                        player.position
                    );
                    return;
                }

                const isJailSpace = Number(player.position) === 10;
                const isInJail = Number(player.is_in_jail) === 1;
                const tokenGroupClass = isJailSpace
                    ? isInJail
                        ? 'player-tokens jail-inmates'

                const tokenGroupSelector = isJailSpace
                    ? isInJail
                        ? '.player-tokens.jail-inmates'
                        : '.player-tokens.jail-visitors'
                    : '.player-tokens';
                let container = space.querySelector(tokenGroupSelector);

                if (!container) {
                    container = document.createElement('div');
                    container.className = tokenGroupClass;
                    space.appendChild(container);
                }

                const token = document.createElement('span');
                token.className = 'player-token';
                token.textContent = tokenIcons[player.token_type] || '❓';
                token.title = player.player_name;
                token.setAttribute('aria-label', player.player_name);

                container.appendChild(token);
            });
        }

                    return;
                }

                const balance = Number(player.money);
                const token = tokenIcons[player.token_type] || '❓';

                const name = document.createElement('h3');
                name.textContent = `${token} ${player.player_name}`;

                const money = document.createElement('p');
                money.textContent = `Cash: ${
                    Number.isFinite(balance)
                        ? balance.toLocaleString('en-US', {
                            style: 'currency',
                            currency: 'USD',
                            maximumFractionDigits: 0
                        })
                        : 'Unavailable'
                }`;
                const playerProperties = ownedPropertyRows.filter(
                    property => Number(property.player_id) === Number(player.player_id)
                );
                const propertiesTab = document.createElement('details');
                propertiesTab.className = 'owned-properties-tab';

                const propertiesTabLabel = document.createElement('summary');
                propertiesTabLabel.textContent = `Properties (${playerProperties.length})`;

                const propertiesList = document.createElement('ul');
                propertiesList.className = 'owned-properties-list';

                if (playerProperties.length === 0) {
                    const emptyMessage = document.createElement('li');
                    emptyMessage.className = 'owned-properties-empty';
                    emptyMessage.textContent = 'No properties owned yet.';
                    propertiesList.append(emptyMessage);
                } else {
                    const colorSetNames = {
                        '#9556a5': 'Purple Set',
                        '#75b9e7': 'Light Blue Set',
                        '#f49ac1': 'Pink Set',
                        '#f79436': 'Orange Set',
                        '#ed4545': 'Red Set',
                        '#800000': 'Maroon Set',
                        '#f5d34d': 'Yellow Set',
                        '#1134a6': 'Dark Blue Set'
                    };
                    const railroadNames = new Set([
                        'short line',
                        'pennsylvania railroad',
                        'b&o railroad',
                        'reading railroad'
                    ]);
                    const utilityNames = new Set([
                        'electric company',
                        'water works'
                    ]);
                    const normalizeName = name =>
                        String(name || '')
                            .trim()
                            .toLowerCase()
                            .replace(/^pennslyvania railroad$/, 'pennsylvania railroad');
                    const orderedProperties = [...playerProperties].sort((a, b) => {
                        const aPosition = boardSpaces.findIndex(
                            space => normalizeName(space.name) === normalizeName(a.property_name)
                        );
                        const bPosition = boardSpaces.findIndex(
                            space => normalizeName(space.name) === normalizeName(b.property_name)
                        );
                        return (aPosition < 0 ? Infinity : aPosition) -
                            (bPosition < 0 ? Infinity : bPosition);
                    });
                    const groups = new Map();

                    orderedProperties.forEach(property => {
                        const normalizedName = normalizeName(property.property_name);
                        const boardSpace = boardSpaces.find(
                            space => normalizeName(space.name) === normalizedName
                        );
                        const groupLabel =
                            isRailroadProperty(property) ||
                            railroadNames.has(normalizedName)
                            ? 'Railroads'
                            : utilityNames.has(normalizedName)
                                ? 'Utilities'
                                : colorSetNames[boardSpace?.color?.toLowerCase()] || 'Other';
                        const groupColor = groupLabel === 'Railroads'
                            ? '#222222'
                            : groupLabel === 'Utilities'
                                ? '#aaaaaa'
                                : boardSpace?.color || '#888888';

                        if (!groups.has(groupLabel)) {
                            groups.set(groupLabel, {
                                color: groupColor,
                                properties: []
                            });
                        }

                        groups.get(groupLabel).properties.push({ property, boardSpace });
                    });

                    groups.forEach((group, groupLabel) => {
                        const groupItem = document.createElement('li');
                        groupItem.className = 'owned-property-group';

                        const heading = document.createElement('div');
                        heading.className = 'owned-property-group-heading';

                        const swatch = document.createElement('span');
                        swatch.className = 'owned-property-group-swatch';
                        swatch.style.backgroundColor = group.color;
                        swatch.setAttribute('aria-hidden', 'true');

                        const headingLabel = document.createElement('strong');
                        headingLabel.textContent = groupLabel;
                        heading.append(swatch, headingLabel);

                        const groupList = document.createElement('ul');
                        groupList.className = 'owned-property-group-items';

                        group.properties.forEach(({ property, boardSpace }) => {
                            const item = document.createElement('li');
                            const propertyButton = document.createElement('button');
                            propertyButton.type = 'button';
                            propertyButton.className = 'owned-property-item';

                            const sprite = document.createElement('span');
                            sprite.className = 'owned-property-sprite';
                            sprite.style.backgroundColor = boardSpace?.color || group.color;
                            sprite.setAttribute('aria-hidden', 'true');

                            const propertyName = document.createElement('span');
                            propertyName.className = 'owned-property-name';
                            propertyName.textContent = property.property_name;
                            propertyButton.append(sprite, propertyName);

                            if (boardSpace?.price !== undefined) {
                                const propertyPrice = document.createElement('span');
                                propertyPrice.className = 'owned-property-price';
                                propertyPrice.textContent = `$${boardSpace.price}`;
                                propertyButton.append(propertyPrice);
                            }

                            propertyButton.addEventListener('click', () => {
                                showPropertyCard(property);
                            });
                            item.append(propertyButton);
                            groupList.append(item);
                        });

                        groupItem.append(heading, groupList);
                        propertiesList.append(groupItem);
                    });
                }

                propertiesTab.append(propertiesTabLabel, propertiesList);

                const improvements = document.createElement('p');
                improvements.textContent = 'Houses / hotels: 0';

                card.append(
                    name,
                    money,
                    improvements,
                    propertiesTab
                );

                card.hidden = false;
            });
        }



        async function loadPlayerTokens() {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get("gameId") || document.body.dataset.gameId;

            if (!gameId) {
                console.error("Missing gameId in URL.");
                return;
            }

            try {
                const response = await fetch(
                    `/game-room?gameId=${encodeURIComponent(gameId)}`
                );

                if (!response.ok) {
                    throw new Error(`Failed to load game: ${response.status}`);
                }

                const data = await response.json();

                placePlayerTokens(data.players);
                displayPlayerCards(data.players, data.properties || []);
                const currentPlayerId = Number(data.game.current_player_id);
                const currentPlayer = data.players.find(
                    player => Number(player.player_id) === currentPlayerId
                );
                const turnIndicator = document.getElementById('current-turn-indicator');
                if (turnIndicator) {
                    turnIndicator.textContent = currentPlayer
                        ? `${currentPlayer.player_name}, it's your turn.`
                        : 'Waiting for the next turn.';
                }

                const myPlayer = data.players.find(
                    player => Number(player.user_id) === Number(data.currentUserId)
                );

                const useJailCardButton =
                    document.getElementById('use-jail-card-button');

                if (useJailCardButton) {
                    const isMyTurn =
                        myPlayer &&
                        Number(myPlayer.player_id) === Number(currentPlayerId);

                    const hasJailCard =
                        myPlayer &&
                        Number(myPlayer.jail_free_cards) > 0;

                    useJailCardButton.hidden = !(
                        isMyTurn &&
                        Number(myPlayer.is_in_jail) === 1 &&
                        hasJailCard
                    );
                }

                const popupOpen =
                    !propertyPurchaseMenu.hidden ||
                    !document.getElementById('rent-popup').hidden;

                console.log('Property menu hidden:', propertyPurchaseMenu.hidden);
                console.log(
                    'Rent popup hidden:',
                    document.getElementById('rent-popup').hidden
                );

                return data;
            } catch (error) {
                console.error("Error loading player tokens:", error);
            }
        }
        loadPlayerTokens();
    </script>
</body>
</html>
