
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlineopoly - Game Room</title>

    <style>
        
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: #c2eccd;
            margin: 0;
            min-height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #222;
        }

        .room-container {
            background-color: white;
            border: 5px solid black;
            border-radius: 25px;
            padding: 35px;
            width: 700px;
            max-width: 100%;
            box-sizing: border-box;
        }

        h1 {
            color: #f48859;
            text-align: center;
            font-size: 36px;
            margin-top: 0;
        }

        h2 {
            text-align: center;
            font-size: 25px;
        }

        .room-info {
            padding: 15px;
            background-color: #f3f8f4;
            border: 1px solid #c2eccd;
            border-radius: 10px;
            text-align: center;
        }

        .room-info p {
            margin: 10px 0;
            font-size: 17px;
        }

        #player-list {
            padding: 0;
            list-style: none;
        }

        #player-list li {
            padding: 14px;
            margin: 10px 0;
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 17px;
        }

        .room-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            box-sizing: border-box;
            flex: 1;
            padding: 14px 20px;
            background-color: #e52521;
            color: white;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #bd1c19;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #room-message {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .room-container {
                padding: 22px;
            }

            .room-buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                flex: auto;
            }
        }

        #refresh-room {
            background: #e2e6ea;
        }

        #start-game {
            background: #238636;
            color: white;
        }

        #start-game:disabled {
            background-color: #999;
            color: #eeeeee;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #room-message {
            text-align: center;
            margin-top: 20px;
        }

        
        .game-board {
            display: grid;
            grid-template-columns: repeat(11, minmax(0, 1fr));
            grid-template-rows: repeat(11, minmax(0, 1fr));
            width: min(90vw, 750px);
            aspect-ratio: 1 / 1;
            margin: 25px auto;
            border: 4px solid black;
            background-color: #d8f0dc;
            gap: 2px;
        }

        .board-space {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
            min-height: 0;
            padding: 3px;
            box-sizing: border-box;
            border: 1px solid #333;
            background-color: white;
            text-align: center;
            overflow: hidden;
        }

        .property-color {
            width: 100%;
            height: 20%;
            min-height: 4px;
            flex-shrink: 0;
        }

        .space-name {
            font-size: clamp(6px, 0.8vw, 11px);
            overflow-wrap: anywhere;
        }

        .space-price {
            font-size: clamp(6px, 0.7vw, 10px);
        }

        .board-space.corner {
            background-color: #f8e7b0;
            font-weight: bold;
        }

        .board-center {
            grid-row: 2 / 11;
            grid-column: 2 / 11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
        }

        .board-center h2 {
            color: #238636;
        }


        .board-center p {
            font-size: clamp(10px, 1.5vw, 16px);
        }

        .board-center .dice-placeholder {
            font-size: 35px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .game-board {
                 grid-template-rows: repeat(11, minmax(30px, 1fr));
                 gap: 1px;
                border-width: 2px;
            }

        .board-space {
            padding: 1px;
        }
}
    </style>
</head>

<body>
    <main class="room-container">
        <h1>Onlineopoly</h1>
        <h2>Game Room</h2>

        <div class="room-info">
            <p>Game ID: <strong id="game-id">Loading...</strong></p>
            <p>Status: <strong id="game-status">Loading...</strong></p>
            <p>Players: <strong id="player-count">0</strong></p>
        </div>

        
        <section id="game-board-section" hidden>
            <div class="game-board" id="game-board">

                <div class="board-center">
                    <h2>ONLINEOPOLY</h2>
                    <p>Your game. Your properties. Your strategy.</p>
                    <p id="current-player">Waiting for the first turn...</p>
                    <div class="dice-placeholder">🎲 🎲</div>
                </div>

            </div>
        </section>


        <h2>Players List</h2>
        <ul id="player-list">
            <li>Loading players...</li>
        </ul>

        <div class="room-buttons">
            <button id="refresh-room">Refresh Room</button>
            <button id="start-game">Start Game</button>
            <button id="Back to Games">Back to Online Games</button>
        </div>

        <p id="room-message"></p>
    </main>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        console.log('Room JavaScript is running!');
        console.log('Socket.IO library check:', typeof io);
    
    const socket = io();

    socket.on('connect_error', (error) => {
        console.error('Socket connection failed:', error.message);
    });

     socket.on('connect', () => {
        console.log('Socket connected successfully:', socket.id);
        console.log('Joining game:', gameId);
        socket.emit('join-game', gameId);
    });

    socket.on('disconnect', () => {
        console.log('Disconnected from Socket.IO');
    });

   
socket.on('test-message', (message) => {
    console.log('Message received from game room:', message);
});

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('gameId');

    console.log('Game ID from URL:', gameId);
    console.log('Socket connected?', socket.connected);


    const gameIdElement = document.getElementById('game-id');
    const gameStatusElement = document.getElementById('game-status');
    const playerCountElement = document.getElementById('player-count');
    const playerListElement = document.getElementById('player-list');
    const roomMessageElement = document.getElementById('room-message');
    const refreshButton = document.getElementById('refresh-room');
    const startButton = document.getElementById('start-game');
    const backButton = document.getElementById('Back to Games');

    
const boardSpaces = [
    { name: "GO", type: "corner" },
    { name: "Maple Lane", color: "#9556a5", price: 60 },
    { name: "Community Chest", type: "special" },
    { name: "Oak Street", color: "#9556a5", price: 60 },
    { name: "Income Tax", type: "special" },
    { name: "Central Station", color: "#222222", price: 200 },
    { name: "Pine Avenue", color: "#75b9e7", price: 100 },
    { name: "Chance", type: "special" },
    { name: "Cedar Avenue", color: "#75b9e7", price: 100 },
    { name: "Lake Road", color: "#75b9e7", price: 120 },
    { name: "Jail / Visit", type: "corner" },

    { name: "Willow Place", color: "#d94343", price: 140 },
    { name: "Electric Company", color: "#aaaaaa", price: 150 },
    { name: "Birch Street", color: "#d94343", price: 140 },
    { name: "Elm Street", color: "#d94343", price: 160 },
    { name: "North Station", color: "#222222", price: 200 },
    { name: "Rose Avenue", color: "#f49ac1", price: 180 },
    { name: "Community Chest", type: "special" },
    { name: "Tulip Street", color: "#f49ac1", price: 180 },
    { name: "Garden Lane", color: "#f49ac1", price: 200 },
    { name: "Free Parking", type: "corner" },

    { name: "River Road", color: "#f79436", price: 220 },
    { name: "Chance", type: "special" },
    { name: "Hill Street", color: "#f79436", price: 220 },
    { name: "Valley Avenue", color: "#f79436", price: 240 },
    { name: "East Station", color: "#222222", price: 200 },
    { name: "Cloud Street", color: "#ed4545", price: 260 },
    { name: "Harbor Road", color: "#ed4545", price: 260 },
    { name: "Water Works", color: "#aaaaaa", price: 150 },
    { name: "Sunset Avenue", color: "#ed4545", price: 280 },
    { name: "Go To Jail", type: "corner" },

    { name: "Forest Drive", color: "#f5d34d", price: 300 },
    { name: "Meadow Lane", color: "#f5d34d", price: 300 },
    { name: "Community Chest", type: "special" },
    { name: "Golden Avenue", color: "#f5d34d", price: 320 },
    { name: "West Station", color: "#222222", price: 200 },
    { name: "Chance", type: "special" },
    { name: "Skyline Drive", color: "#3a9a68", price: 350 },
    { name: "Luxury Tax", type: "special" },
    { name: "Ocean Boulevard", color: "#3a9a68", price: 400 }
];

function buildBoard() {
    const board = document.getElementById("game-board");

    // Keep the center panel and remove any old spaces.
    board.querySelectorAll(".board-space").forEach(space => space.remove());

    boardSpaces.forEach((space, index) => {
        const tile = document.createElement("div");
        tile.className = "board-space";

        if (space.type === "corner") {
            tile.classList.add("corner");
        }

        // Place the 40 spaces around the outer edge clockwise.
        let row;
        let col;

        if (index <= 10) {
            row = 11;
            col = 11 - index;
        } else if (index <= 19) {
            row = 11 - (index - 10);
            col = 1;
        } else if (index <= 30) {
            row = 1;
            col = index - 19;
        } else {
            row = index - 29;
            col = 11;
        }

        tile.style.gridRow = row;
        tile.style.gridColumn = col;

        if (space.color) {
            const colorBand = document.createElement("div");
            colorBand.className = "property-color";
            colorBand.style.backgroundColor = space.color;
            tile.appendChild(colorBand);
        }

        const name = document.createElement("span");
        name.className = "space-name";
        name.textContent = space.name;
        tile.appendChild(name);

        if (space.price !== undefined) {
            const price = document.createElement("span");
            price.className = "space-price";
            price.textContent = `$${space.price}`;
            tile.appendChild(price);
        }

        board.appendChild(tile);
    });
}

buildBoard();



    async function loadRoom() {
        if (!gameId) {
            roomMessageElement.textContent =
                'No game ID was provided in the URL.';
            return;
        }

        try {
            const response = await fetch(
                `/game-room?gameId=${encodeURIComponent(gameId)}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Could not load game room.');
            }

            gameIdElement.textContent = data.game.game_id;
            gameStatusElement.textContent =
                data.game.game_status === 'in_progress'
                    ? 'In Progress'
                    : data.game.game_status === 'waiting'
                            ? 'Waiting'
                            : data.game.game_status;

            document.getElementById('game-board-section').hidden =
                data.game.game_status !== 'in_progress';
            playerCountElement.textContent = data.players.length;

            startButton.disabled = true;

        const sessionResponse = await fetch('/session');
        const sessionData = await sessionResponse.json();

        const isHost =
            Number(data.game.host_user_id) === Number(sessionData.userId);

        startButton.disabled =
            !isHost || data.game.game_status !== 'waiting';

        console.log('Logged-in player ID:', sessionData.userId);
        console.log('Host ID:', data.game.host_user_id);
        console.log('Is host:', isHost);
        console.log('Button disabled:', startButton.disabled);

            playerListElement.replaceChildren();

            if (data.players.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No players have joined yet.';
                playerListElement.appendChild(li);
            } else {
                 
                data.players.forEach(player => {
                    const li = document.createElement('li');
                    li.textContent = player.player_name;
                    playerListElement.appendChild(li);
                });

            }

            roomMessageElement.textContent = '';
        } catch (error) {
            console.error('Error loading room:', error);
            roomMessageElement.textContent = error.message;
        }
    }

    refreshButton.addEventListener('click', loadRoom);
    backButton.addEventListener('click', () => {
    window.location.href = '/lobby';
    });
    startButton.addEventListener('click', async () => {
    console.log('Start Game button clicked!');
    startButton.disabled = true;
    roomMessageElement.textContent = 'Starting game...';

    try {
        const response = await fetch('/games/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                gameId: Number(gameId)
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || 'Could not start the game.'
            );
        }

        roomMessageElement.textContent =
            data.message || 'Game started successfully!';

        window.location.href = `/board?
        gameId=${encodeURIComponent(gameId)}`;
    } catch (error) {
        console.error('Error starting game:', error);
        roomMessageElement.textContent = error.message;
        await loadRoom();
    }
});

    loadRoom();
</script>
</body>
</html>
