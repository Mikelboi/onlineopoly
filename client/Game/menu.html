<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlineopoly </title>

    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: #c2eccd;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-box {
            background-color: white;
            border: 5px solid black;
            border-radius: 25px;
            padding: 45px;
            width: 550px;
            max-width: calc(100vw - 100px);
            box-sizing: border-box;
        }
        

        h1 {
            color: #f48859;
            text-align: center;
        }

        h2 {
            display: block;
            width: 100%;
            text-align: center;
            margin: 20px 0 25px 0;
            padding: 0;
            position: static;
            box-sizing: border-box;
        }

        .welcome-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 25px;
        }

        .welcome-row h2 {
            width: auto;
            margin: 0;
        }

        button {
            box-sizing: border-box;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #e52521;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button.avatar-menu-icon {
            display: block;
            width: 80px;
            height: 80px;
            margin: 16px auto;
            padding: 8px;
            border: 3px solid #356b43;
            border-radius: 50%;
            background-color: #238636;
        }

        .avatar-menu-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .avatar-menu-icon img[hidden],
        .avatar-menu-icon svg[hidden] {
            display: none;
        }

        .welcome-row button.avatar-menu-icon {
            flex: 0 0 80px;
            margin: 0;
        }

        button.avatar-menu-icon:hover {
            background-color: #1b6f2b;
        }

        .avatar-menu-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: white;
        }

        button:hover {
            background-color: #bd1c19;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="menu-box">
        <h1>ONLINEOPOLY</h1>
        <div class="welcome-row">
            <button
                id="player-avatar"
                class="avatar-menu-icon"
                type="button"
                aria-label="Choose player avatar"
                title="Choose player avatar"
            >
                <img
                    id="menu-avatar-image"
                    alt="Your avatar"
                    hidden
                >
                <svg
                    id="default-avatar-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.2 0-7.5 2.1-7.5 4.8V22h15v-3.2c0-2.7-3.3-4.8-7.5-4.8Z" />
                </svg>
            </button>
            <h2 id="welcome-heading">Welcome!</h2>
        </div>

        <button id="play-local">Play Local</button>
        <button id="play-online">Play Online</button>
        <button id="how-to-play">How to Play</button>
        <button id="Statistics">Statistics</button>
        <button id="log-out">Log Out</button>

        <p id="message" role="status"></p>
        
    </main>

    <script>
        const message = document.getElementById('message');
        const welcomeHeading = document.getElementById('welcome-heading');
        const menuAvatarImage = document.getElementById('menu-avatar-image');
        const defaultAvatarIcon = document.getElementById('default-avatar-icon');

        async function loadUsername() {
            try {
                const response = await fetch('/session');

                if (response.ok) {
                    const result = await response.json();
                    welcomeHeading.textContent = `Welcome, ${result.username}!`;

                    if (result.avatarPath) {
                        menuAvatarImage.src = result.avatarPath;
                        menuAvatarImage.hidden = false;
                        defaultAvatarIcon.hidden = true;
                    }
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                message.textContent = 'Could not load your username.';
            }
        }

        loadUsername();
        document.getElementById('player-avatar')
            .addEventListener('click', () => {
                window.location.href = '/avatar-selection';
            });

        document.getElementById('play-online')
            .addEventListener('click', () => {
                window.location.href = '/lobby';
            });

        document.getElementById('play-local')
            .addEventListener('click', () => {
                window.location.href = '/local-lobby';
            });

        document.getElementById('how-to-play')
            .addEventListener('click', () => {
                window.open('/rules', '_blank', 'noopener');
            });

        document.getElementById('Statistics')
            .addEventListener('click', () => {
                window.location.href = '/stats';
            });

        const logoutButton = document.getElementById('log-out');
        logoutButton.addEventListener('click', async () => {
            logoutButton.disabled = true;
            logoutButton.textContent = 'Logging Out...';

            try {
                const response = await fetch('/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    window.location.href = '/login';
                } else {
                    message.textContent =
                        'Could not log out. Please try again.';
                    logoutButton.disabled = false;
                    logoutButton.textContent = 'Log Out';
                }
            } catch (error) {
                message.textContent =
                    'Could not connect to the server.';
                logoutButton.disabled = false;
                logoutButton.textContent = 'Log Out';
            }
        });
    </script>
</body>
</html>
